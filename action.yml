name: Inwoven product files
description: Check product files and report changes that need an explicit request
inputs:
  root:
    description: Product files directory
    default: docs/product
  guard-base:
    description: Optional git revision to compare
    default: ''
  fail-on-guard:
    description: Fail when guard reports a change
    default: 'false'
outputs:
  diagnostics:
    description: Captured check and guard diagnostics
    value: ${{ steps.format.outputs.diagnostics }}${{ steps.guard.outputs.diagnostics }}
runs:
  using: composite
  steps:
    - name: Check format
      id: format
      shell: bash
      env:
        INWOVEN_ROOT: ${{ inputs.root }}
      run: |
        set +e
        diagnostic_file="$RUNNER_TEMP/inwoven-check-$RANDOM.log"
        python3 "$GITHUB_ACTION_PATH/skills/inwoven/scripts/inwoven.py" check --root "$INWOVEN_ROOT" >"$diagnostic_file" 2>&1
        result=$?
        cat "$diagnostic_file"
        delimiter="inwoven_${RANDOM}_${RANDOM}"
        { echo "diagnostics<<$delimiter"; cat "$diagnostic_file"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
        exit "$result"
    - name: Guard requested changes
      id: guard
      if: inputs.guard-base != ''
      shell: bash
      env:
        INWOVEN_ROOT: ${{ inputs.root }}
        INWOVEN_BASE: ${{ inputs.guard-base }}
        INWOVEN_FAIL: ${{ inputs.fail-on-guard }}
      run: |
        set +e
        diagnostic_file="$RUNNER_TEMP/inwoven-guard-$RANDOM.log"
        python3 "$GITHUB_ACTION_PATH/skills/inwoven/scripts/inwoven.py" guard --root "$INWOVEN_ROOT" --base "$INWOVEN_BASE" >"$diagnostic_file" 2>&1
        result=$?
        cat "$diagnostic_file"
        delimiter="inwoven_${RANDOM}_${RANDOM}"
        { echo "diagnostics<<$delimiter"; cat "$diagnostic_file"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
        if [ "$result" -ne 0 ]; then
          if [ "$INWOVEN_FAIL" = true ]; then exit "$result"; fi
          if [ "$result" -eq 1 ]; then
            echo '::warning::Inwoven guard found changes; confirm each against the request.'
          else
            echo '::warning::Inwoven guard could not compare; check the root and fetch the base revision.'
          fi
        fi
