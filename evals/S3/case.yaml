{
  "schema_version": "1.1",
  "name": "S3",
  "runs": 1,
  "context": {
    "scaffold_script": "fixture.sh"
  },
  "execution": {
    "prompt": "I finished the top item, mark it done.",
    "max_turns": 25,
    "timeout_seconds": 300,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Bash",
      "Edit",
      "Write"
    ]
  },
  "graders": [
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "requested_outcome",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "docs/product/backlog.md"
      },
      "pattern": "\\| M231\\. Search notes as you type \\|[^\\n]*\\| Done<br>Accepted: \\d{4}-\\d{2}-\\d{2}(?: by [^|<]+)?(?:<br>[^|]+)? \\| Dana \\|",
      "flags": "i"
    }
  ]
}
