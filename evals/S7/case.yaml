{
  "schema_version": "1.1",
  "name": "S7",
  "runs": 1,
  "context": {
    "scaffold_script": "fixture.sh"
  },
  "execution": {
    "prompt": "Reorder: move the last To Do item to the top.",
    "max_turns": 25,
    "timeout_seconds": 300,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Bash",
      "Edit",
      "Write"
    ]
  },
  "graders": [
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "requested_outcome",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "docs/product/backlog.md"
      },
      "pattern": "\\| C306\\. Offline editing[^\\n]*\\n\\| (?:M231\\. Search notes as you type|P512\\. Colour tags for notes)",
      "flags": "i"
    }
  ]
}
