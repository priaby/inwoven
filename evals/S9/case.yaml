{
  "schema_version": "1.1",
  "name": "S9",
  "runs": 1,
  "context": {
    "scaffold_script": "fixture.sh"
  },
  "execution": {
    "prompt": "Add three items: dark mode, CSV import, SSO.",
    "max_turns": 25,
    "timeout_seconds": 300,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Bash",
      "Edit",
      "Write"
    ]
  },
  "graders": [
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "requested_outcome",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "docs/product/backlog.md"
      },
      "pattern": "\\| [ABCDEFGHJKLMNPRSTUVWXYZ][1-9][0-9]{2}\\.[^\\n]*(?:CSV[^\\n]*import|import[^\\n]*CSV)[^\\n]*\\n\\| [ABCDEFGHJKLMNPRSTUVWXYZ][1-9][0-9]{2}\\.[^\\n]*(?:SSO|sign-on|sign on)[^\\n]*",
      "flags": "i"
    },
    {
      "name": "mint_id",
      "type": "tool_used",
      "tool": "Bash",
      "input_match": "inwoven\\.py[^;]*new-id",
      "arm": "with-only"
    }
  ]
}
