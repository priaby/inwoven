name: Self-test
on:
  push:
  pull_request:
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - uses: ./
        with:
          root: skills/inwoven/assets
      - name: Prepare broken fixture
        shell: bash
        run: |
          mkdir broken
          cp skills/inwoven/assets/backlog.md broken/backlog.md
          echo '| K417. Duplicate id | | | | |' >> broken/backlog.md
      - uses: ./
        id: broken
        continue-on-error: true
        with:
          root: broken
      - name: Require rejection
        shell: bash
        run: |
          test "$BROKEN_RESULT" = failure
          python3 skills/inwoven/scripts/inwoven.py check --root broken > broken-check.log 2>&1 && exit 1 || result=$?
          test "$result" = 1
          grep -F 'duplicate id K417' broken-check.log
          printf '%s\n' "$BROKEN_DIAGNOSTICS" | grep -F 'duplicate id K417'
        # The composite also exposes its actual diagnostic, so unrelated failures fail.
        env:
          BROKEN_RESULT: ${{ steps.broken.outcome }}
          BROKEN_DIAGNOSTICS: ${{ steps.broken.outputs.diagnostics }}
      - name: Prepare guard fixture
        shell: bash
        run: |
          mkdir guard-fixture
          cp skills/inwoven/assets/backlog.md guard-fixture/backlog.md
          git -C guard-fixture init -b main
          git -C guard-fixture -c user.name=Test -c user.email=test@example.invalid add .
          git -C guard-fixture -c user.name=Test -c user.email=test@example.invalid commit -m base
          python3 -c 'from pathlib import Path; p=Path("guard-fixture/backlog.md"); p.write_text(p.read_text().replace("|  |  |  |  |", "|  |  | Done |  |"))'
      - uses: ./
        with:
          root: guard-fixture
          guard-base: HEAD
      - uses: ./
        id: guard-strict
        continue-on-error: true
        with:
          root: guard-fixture
          guard-base: HEAD
          fail-on-guard: 'true'
      - name: Require strict guard rejection
        shell: bash
        env:
          GUARD_RESULT: ${{ steps.guard-strict.outcome }}
          GUARD_DIAGNOSTICS: ${{ steps.guard-strict.outputs.diagnostics }}
        run: |
          test "$GUARD_RESULT" = failure
          printf '%s\n' "$GUARD_DIAGNOSTICS" | grep -F 'newly Done: K417'
          if python3 skills/inwoven/scripts/inwoven.py guard --root guard-fixture --base HEAD > guard-check.log 2>&1; then exit 1; else result=$?; fi
          test "$result" = 1
          grep -F 'newly Done: K417' guard-check.log
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generate consumer repo and synthetic base commit
        shell: bash
        run: |
          mkdir -p consumer/docs/product
          cp skills/inwoven/assets/*.md consumer/docs/product/
          git -C consumer init
          git -C consumer add .
          git -C consumer -c user.name=Test -c user.email=test@example.invalid commit -m base
      - uses: priaby/inwoven@v0
        with:
          root: consumer/docs/product
          guard-base: HEAD
          fail-on-guard: 'true'
      - name: Generate an acceptance requiring confirmation
        shell: bash
        run: python -c 'from pathlib import Path; p=Path("consumer/docs/product/backlog.md"); p.write_text(p.read_text().replace("|  |  |  |  |", "|  |  | Done |  |"))'
      - name: Capture the remote Action diagnostics
        shell: bash
        run: python3 tests/action_remote_probe.py
      - uses: priaby/inwoven@v0
        id: remote-guard
        continue-on-error: true
        with:
          root: consumer/docs/product
          guard-base: HEAD
          fail-on-guard: 'true'
      - name: Require remote strict guard rejection
        shell: bash
        env:
          GUARD_RESULT: ${{ steps.remote-guard.outcome }}
        run: |
          test "$GUARD_RESULT" = failure
          test "$(cat "$INWOVEN_REMOTE_STATUS")" = 1
          grep -F 'newly Done: K417' "$INWOVEN_REMOTE_LOG"
