name: Public install
on:
  push:
    branches: [main, ci-dev]
    tags: ['*']
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host CLIs from npm
        run: npm i -g @anthropic-ai/claude-code @openai/codex
      - name: Install verified GitHub CLI with skill support
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/install_smoke.py gh-cli
      - name: Install from GitHub and run installed tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/install_smoke.py hosts
      - name: Download latest release and verify skill ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/install_smoke.py release
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host CLIs from npm
        run: npm i -g @anthropic-ai/claude-code @openai/codex
      - name: Install verified GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python tests/install_smoke.py gh-cli
      - name: Install candidate and exercise installed hooks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python tests/install_smoke.py candidate
